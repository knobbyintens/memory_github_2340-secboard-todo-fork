[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "0.4.0"
description = "A tiny command-line todo list."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
todo = "todo.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
